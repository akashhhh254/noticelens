<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Not Found - NoticeLens</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .not-found-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 3rem 2rem; max-width: 480px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); }
        .btn-primary { background: #2563eb; color: #fff; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-block; }
    </style>
</head>
<body class="center-body">
    <div class="card not-found-card">
        <h2>Notice Not Found</h2>
        <p class="hint-text">{{ message or "The notice link you followed may have expired or is invalid." }}</p>
        <a href="/" class="btn btn-primary" style="display:inline-block; margin-top: 1rem;">Back to NoticeLens</a>
    </div>
</body>
</html>
